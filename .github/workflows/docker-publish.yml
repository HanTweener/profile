name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SITE_URL=${{ vars.VITE_SITE_URL }}
            VITE_PROFILE_EMAIL=${{ vars.VITE_PROFILE_EMAIL }}
            VITE_GITHUB_USERNAME=${{ vars.VITE_GITHUB_USERNAME }}
            VITE_GITHUB_URL=${{ vars.VITE_GITHUB_URL }}
            VITE_PROJECT_1_URL=${{ vars.VITE_PROJECT_1_URL }}
            VITE_PROJECT_2_URL=${{ vars.VITE_PROJECT_2_URL }}
            VITE_PROJECT_4_URL=${{ vars.VITE_PROJECT_4_URL }}
            VITE_PROJECT_5_URL=${{ vars.VITE_PROJECT_5_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
